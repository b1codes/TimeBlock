name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start Firestore Emulator
        run: docker compose up -d firestore-emulator

      - name: Wait for Firestore Emulator
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8082/ > /dev/null 2>&1; then
              echo "Emulator ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "Emulator failed to start within 60s."
          docker compose logs firestore-emulator
          exit 1

      - name: Run Tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8082
          GOOGLE_CLOUD_PROJECT: timeblock-local
        run: |
          cd backend
          pytest tests

  frontend-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: 'frontend/pnpm-lock.yaml'

      - name: Install Dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        run: |
          cd frontend
          pnpm exec tsc --noEmit

      - name: Run Tests
        run: |
          cd frontend
          pnpm test

  infra-check:
    name: Terraform Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          cd infra
          terraform fmt -check
